<section class="mb-5 custom_class" style="position: relative;z-index: 9;">
    <div class="container h-100">
        <div class="card card-body p-4">
        <div class="row d-flex justify-content-center">
            <div class="col-12 col-md-5 col-lg-5">
                <div class="border border-3 border-primary"></div>
                <div class="card bg-white shadow-lg my_card rounded-0">
                    <div class="card-body p-4">
                        <!-- mt-md-4 -->
                        <!-- <button class="oauth-login" (click)="getUserDetails()">Sign In with Startup India</button> -->

                        <form class="mb-3" [formGroup]="loginForm">
                            <div class="form-group">
                                <label for="email" class="form-label">Username</label>
                                <input type="email" formControlName="email" autocomplete="off" class="form-control"
                                    id="email" placeholder="Enter Username">
                                    <div *ngIf="(loginFormCtrls['email'].touched || submitted) && loginFormCtrls['email'].invalid ">
                                        <div *ngIf="loginFormCtrls['email'].hasError('required')" class="text-danger">
                                            Username is Required
                                        </div>
                                    </div>

                                <!-- <div *ngIf="(loginFormCtrls.email.touched || submitted) && loginFormCtrls.email.invalid">
                                    <span class="text-danger" *ngIf="loginFormCtrls.email.errors.required">
                                        Username is required
                                    </span>
                                </div> -->
                            </div>
                            <div class="form-group">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" formControlName="password" autocomplete="off"
                                    class="form-control" id="password" placeholder="Enter Password">
                                    <div *ngIf="(loginFormCtrls['password'].touched || submitted) && loginFormCtrls['password'].invalid ">
                                        <div *ngIf="loginFormCtrls['password'].hasError('required')" class="text-danger">
                                            Password is Required
                                        </div>
                                    </div>
                                <!-- <div *ngIf="(loginFormCtrls.password.touched || submitted) && loginFormCtrls.password.invalid">
                                    <span class="text-danger" *ngIf="loginFormCtrls.password.errors.required">
                                        Password is required
                                    </span>
                                </div> -->
                            </div>
                                <div class="form-group form-row mt-4">
                                    <div class="hstack gap-2">
                                        <div>
                                            <img [src]="'data:image/jpg;base64,'+imageBase64" width="100" height="50" alt="" />
                                        </div>
                                        <div>
                                            <button type="button" (click)="loadcaptcha();" class="btn btn-primary btn-block btn-sm"> <i
                                                    class="fa fa-undo" aria-hidden="true"></i> <small> Refresh</small></button>
                                        </div>
                                        <div>
                                            <input type="text" class="form-control mt-1" formControlName="captchacode" maxlength="6"
                                                autocomplete="off" placeholder="Captcha Output" required="required">
                                                <div *ngIf="(loginFormCtrls['captchacode'].touched || submitted) && loginFormCtrls['captchacode'].invalid">
                                                    <div *ngIf="loginFormCtrls['captchacode'].hasError('required')" class="text-danger">
                                                        Captcha is Required
                                                    </div>
                                                </div>
                                        </div>
                    
                                </div>
                            </div>

                            <div class="d-grid">
                                <button class="btn btn-outline-dark login_btn" type="submit"
                                    (click)="loginNew()">Login</button>
                            </div>                           
                        </form>
                       </div>
                </div>
            </div>
        </div>
        </div>
    </div>
</section>
