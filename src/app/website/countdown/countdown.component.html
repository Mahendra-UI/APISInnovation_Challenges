<div class="countertime mb-2 mt-2" *ngIf="timerShow">
  <div class="days rounded">
    <h2>
      {{days}}
    </h2>
    <p>Days</p>
  </div>
  <div class="hours rounded">
    <h2>
      {{hours}}
    </h2>
    <p>Hours</p>
  </div>
  <div class="minutes rounded">
      <h2>
        {{minutes}}
      </h2>
      <p>Minutes</p>
  </div>
  <div class="seconds rounded">
    <h2>
      {{seconds}}
    </h2>
    <p>Seconds</p>
  </div>
</div>
