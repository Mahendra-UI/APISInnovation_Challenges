<section>
    <div class="container">
        <div class="section_title">
            <h2>Ecosystem Partners
            </h2>
            
        </div>

        <div class="row">
            <div class="col-md-12 d-none">
                <div class="company_logos">
                    <img src="assets/images/organized/one.png" alt="Logo" class="img-fluid">
                    <img src="assets/images/organized/two.png" alt="Logo" class="img-fluid">
                    <img src="assets/images/organized/three.png" alt="Logo" class="img-fluid">

                </div>
            </div>
            <div class="col-md-12">
                <div class="clogos mt-4">
                    <owl-carousel-o [options]="customOptions">
                        <ng-template carouselSlide>
                            <a href="https://msh.meity.gov.in/" target="_blank">
                                <img src="assets/images/cybersecurity/meity.png" alt="Logo" class="img-fluid">
                            </a>
                        </ng-template>
                        <ng-template carouselSlide>
                            <a href="https://www.startupindia.gov.in/" target="_blank">
                                <img src="assets/images/cybersecurity/startupindia.png" alt="Logo" class="img-fluid">
                            </a>
                        </ng-template>
                        <ng-template carouselSlide>
                            <a href="https://apis.ap.gov.in/" target="_blank">

                        <ng-template carouselSlide>
                            <a href="https://apis.ap.gov.in/" target="_blank">
                                <img src="assets/images/cybersecurity/apis.png" alt="Logo" class="img-fluid">
                            </a>
                        </ng-template>
                        <ng-template carouselSlide>
                            <a href="https://vitap.ac.in/" target="_blank">
                                <img src="assets/images/cybersecurity/vit.png" alt="Logo" class="img-fluid">
                            </a>
